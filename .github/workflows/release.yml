name: Release

# Pushing a tag vX.Y.Z (equal to "version" in tan.json) builds kkdesk for
# macOS (Apple silicon and Intel, ad-hoc signed), Windows (x64) and Linux (x64 and
# arm64), plus kkdesk-server and an Android APK. It signs the update manifest (latest.json, with
# binary patches from the previous release) and publishes a GitHub release.
# Clients find it at releases/latest/download/latest.json (internal/update).
#
# Secret: TANGO_UPDATE_KEY, the private update key from tan keygen.
#
# The macOS apps are signed ad hoc (no certificate). macOS keys the Screen
# Recording and Accessibility permissions to the signature, so users grant
# them again after each update; a Developer ID certificate (tan sign) would
# keep them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAN_VERSION: v0.4.0 # github.com/tangoui/tango/cmd/tan

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        name: Tag must match tan.json
        run: |
          version=$(jq -r .version tan.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tan.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    uses: ./.github/workflows/package-desktop.yml

  android:
    needs: version
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  publish:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install tan
        run: go install github.com/tangoui/tango/cmd/tan@$TAN_VERSION
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Unpack the builds
        run: for f in artifacts/build-*/*.tar.gz; do tar -xzf "$f"; done
      - name: Previous release (for binary patches)
        run: |
          prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_REF_NAME" ]; then
            gh release download "$prev" -D prev
            echo "PREV_ARGS=-prev prev" >> "$GITHUB_ENV"
            echo "patches from $prev"
          fi
      - name: Sign the update manifest
        env:
          TANGO_UPDATE_KEY: ${{ secrets.TANGO_UPDATE_KEY }}
        run: |
          notes=()
          [ -f "docs/releases/$VERSION.md" ] && notes=(-notes "@docs/releases/$VERSION.md")
          tan release-manifest -build build -o release -windows exe -linux dir $PREV_ARGS \
            -url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" "${notes[@]}"
          cp server/*.tar.gz artifacts/build-android/*.apk artifacts/installers-*/* release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release
      - name: Publish the release
        run: |
          notes="docs/releases/$VERSION.md"
          [ -f "$notes" ] || { echo "kkdesk $VERSION" > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          # A version with a pre-release suffix (0.1.0-beta.1) is published as a
          # pre-release: it is not "latest", so installed apps do not update to it.
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "kkdesk $VERSION" --notes-file "$notes" --verify-tag "${pre[@]}"
