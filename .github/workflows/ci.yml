name: CI

# Every push and pull request: formatting, vet for the three desktop
# platforms (Windows cross-compiled with mingw-w64), the Go tests that run
# headless on Linux, and a macOS build. macOS tests need screen recording
# and hardware encoding, which hosted runners do not have; run them locally.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt-ed:"; echo "$out"; exit 1; fi
      - name: vet (linux)
        run: CGO_ENABLED=0 go vet ./...
      - name: test (linux)
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
      - name: vet (windows)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc-posix
          CXX: x86_64-w64-mingw32-g++-posix
        run: go vet ./...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: build and vet
        run: |
          CGO_ENABLED=1 go build ./...
          CGO_ENABLED=1 go vet ./...
